<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lights Out in Pickerington</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Karla:ital,wght@0,400;0,600;0,700;1,400&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0B11; --surface:#18131C; --ink:#EDE6DA; --muted:#9E93A3; --red:#E8392F; --glow:rgba(232,57,47,.55);
  --ghost:#8DB4D6; --good:#86C08E; --rule:rgba(237,230,218,.12); --title-fill:transparent;
  --serif:"Libre Baskerville",Georgia,"Times New Roman",serif;
  --sans:"Karla","Helvetica Neue",Arial,sans-serif;
  --crt:"VT323","Courier New",Courier,monospace;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0E0B11; --surface:#18131C; --ink:#EDE6DA; --muted:#9E93A3; --red:#E8392F; --glow:rgba(232,57,47,.55);
  --ghost:#8DB4D6; --good:#86C08E; --rule:rgba(237,230,218,.12); --title-fill:transparent; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:46rem;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0}
p{margin:0 0 .85em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.muted{color:var(--muted)}

/* christmas-light strip */
.lights{display:flex;justify-content:space-between;padding:.25rem .5rem 1.25rem;position:relative}
.lights::before{content:"";position:absolute;left:0;right:0;top:.55rem;height:2px;background:var(--rule)}
.bulb{width:12px;height:18px;border-radius:50% 50% 45% 45%;position:relative;margin-top:.55rem;background:var(--c);box-shadow:0 0 12px 2px var(--c);animation:flick 4s infinite;animation-delay:var(--d)}
@keyframes flick{0%,86%,100%{opacity:1}88%{opacity:.15}90%{opacity:1}93%{opacity:.25}95%{opacity:1}}
.lights.panic .bulb{animation-duration:.5s}

.title{font-size:clamp(2.4rem,9vw,4.2rem);text-transform:uppercase;letter-spacing:.02em;text-align:center;color:var(--title-fill);
  -webkit-text-stroke:1.5px var(--red);text-shadow:0 0 18px var(--glow),0 0 2px var(--glow);line-height:1.05}
.title small{display:block;font-size:.32em;letter-spacing:.35em;-webkit-text-stroke:0;color:var(--red);margin-bottom:.6em}
.sub{text-align:center;font-family:var(--serif);font-style:italic;color:var(--muted);margin-top:.9rem}

.btn{appearance:none;border:1.5px solid var(--red);background:var(--red);color:#fff;padding:.7rem 1.1rem;border-radius:6px;cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--red)}
.btn.small{padding:.4rem .75rem;font-size:.9rem}
.btn:disabled{opacity:.4;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:1.25rem}
.door{margin:2.25rem auto 0;max-width:26rem}
.door label{display:block;font-weight:700;margin-bottom:.4rem}
.door .row{display:flex;gap:.5rem}
input.code{flex:1;min-width:0;padding:.7rem .85rem;background:var(--bg);border:1px solid var(--rule);border-radius:6px;font-family:var(--crt);font-size:1.4rem;letter-spacing:.05em}
.err{color:var(--red);font-size:.95rem;min-height:1.5em;margin-top:.4rem}
.or{text-align:center;margin:1.75rem 0 .5rem;color:var(--muted);font-size:.95rem}
.center{text-align:center}

.gang{margin-top:3.5rem}
.gang h2{font-size:1.5rem;margin-bottom:.25rem}
.gang ul{list-style:none;margin:1.25rem 0 0;padding:0}
.gang li{padding:.9rem 0;border-top:1px solid var(--rule)}
.gang .n{font-family:var(--serif);font-weight:700;font-size:1.15rem}
.gang .nick{color:var(--red);font-weight:700;margin-left:.35rem}
.gang .opt{font-size:.8rem;color:var(--muted);margin-left:.35rem;font-style:italic}
.gang p{margin:.2rem 0 0;font-size:.98rem}
.gang .q{color:var(--muted);font-style:italic}

/* player */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.25rem}
.top .nick{font-family:var(--crt);font-size:1.5rem;color:var(--red);line-height:1}
.top h1{font-size:clamp(1.8rem,7vw,2.5rem)}
.top .actions{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.status{border-radius:6px;padding:.6rem .9rem;margin-bottom:1rem;font-weight:600}
.status.dead{background:color-mix(in srgb,var(--ghost) 18%,transparent);color:var(--ghost);border:1px solid var(--ghost)}
.status.killer{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);border:1px solid var(--red)}
.tabs{display:flex;gap:.2rem;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:1.5rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:.6rem .85rem;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.panel h2{font-size:1.35rem;margin:0 0 .6rem}
.panel h3{font-size:1.05rem;margin:1.5rem 0 .4rem;color:var(--red);font-family:var(--sans);text-transform:uppercase;letter-spacing:.08em}
.quote{font-family:var(--serif);font-style:italic;font-size:1.2rem;line-height:1.5;border-left:3px solid var(--red);padding:.15rem 0 .15rem 1rem;margin:.6rem 0 1rem}
.killer-line{font-family:var(--serif);font-weight:700;font-size:1.6rem;color:var(--red);margin-bottom:.5rem!important}
.knows{padding-left:1.2rem;margin:0}
.knows li{margin-bottom:.6rem}

.roundbox{margin-bottom:1.75rem}
.roundbox h3{margin-top:0}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.6rem}
.loc{appearance:none;text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:.85rem;cursor:pointer;display:flex;gap:.6rem;align-items:center;font-weight:600;line-height:1.3}
.loc:hover{border-color:var(--red)}
.loc .i{font-size:1.4rem}
.result{border-left:4px solid var(--good);padding:.9rem 1rem;background:var(--surface);border-radius:0 8px 8px 0}
.result.trap{border-left-color:var(--red)}
.result.nothing{border-left-color:var(--muted)}
.result .where{font-weight:700;margin-bottom:.35rem}
.confirm{margin-top:.75rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
textarea{width:100%;min-height:14rem;padding:1rem;background:var(--surface);border:1px solid var(--rule);border-radius:8px;line-height:1.6;resize:vertical}
.tiny{font-size:.85rem;color:var(--muted)}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

/* death overlay */
.death{position:fixed;inset:0;z-index:60;background:#07050A;color:#EDE6DA;display:none;place-items:center;padding:2rem;text-align:center;overflow:auto}
.death.on{display:grid;animation:flash .9s steps(2,end) 2}
@keyframes flash{50%{background:#3A0B0B}}
.death h2{font-family:var(--serif);font-size:clamp(1.8rem,7vw,2.8rem);color:#E8392F;text-shadow:0 0 18px rgba(232,57,47,.6);margin-bottom:1rem}
.death .story{font-family:var(--serif);font-style:italic;max-width:30rem;margin:0 auto 1.25rem}
.death .rules{max-width:30rem;margin:0 auto 1.5rem;text-align:left;background:#140F18;border:1px solid rgba(237,230,218,.15);border-radius:8px;padding:1rem 1.2rem}
.death .rules li{margin-bottom:.4rem}
.shade{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;place-items:center;text-align:center;cursor:pointer;padding:2rem}
.shade.on{display:grid}

/* narrator */
.narr .wrap{max-width:60rem}
.slide{min-height:60vh}
.slide h2{font-size:clamp(1.6rem,5vw,2.4rem);margin-bottom:1rem}
.readaloud{font-family:var(--serif);font-size:clamp(1.05rem,2.4vw,1.3rem);line-height:1.7;white-space:pre-line}
.rules-list{font-size:clamp(1rem,2.2vw,1.2rem);padding-left:1.4rem}
.rules-list li{margin-bottom:.7rem}
.clues{font-size:clamp(1rem,2.2vw,1.2rem);padding-left:1.3rem}
.clues li{margin-bottom:.5rem}
.lead{border:2px dashed var(--red);border-radius:8px;padding:1rem 1.2rem;margin:1.25rem 0}
.lead .lt{font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.08em;font-size:.9rem;margin-bottom:.35rem}
.lead p{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.3vw,1.3rem);margin:0}
.roundcode{display:flex;flex-wrap:wrap;gap:1.5rem;align-items:center;justify-content:space-between;margin-top:1.5rem}
.roundcode .lbl{font-size:.9rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.roundcode .w{font-family:var(--crt);font-size:clamp(2.6rem,8vw,4rem);color:var(--red);line-height:1;text-shadow:0 0 14px var(--glow)}
.timer{font-family:var(--crt);font-size:clamp(2.6rem,8vw,4rem);line-height:1}
.timer.over{color:var(--red)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:.75rem;margin-top:1.5rem}
.steps div{border-top:2px solid var(--red);padding-top:.5rem;font-size:.98rem}
.steps b{display:block}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule)}
.dots{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--rule);border:0;padding:0;cursor:pointer}
.dot[aria-current="true"]{background:var(--red)}
.suspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(10rem,1fr));gap:.6rem;margin:1rem 0}
.suspect{appearance:none;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:.8rem;cursor:pointer;text-align:left}
.suspect[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 2px var(--red)}
.suspect b{display:block;font-family:var(--serif)}
.suspect span{color:var(--red);font-size:.9rem}
.tl{list-style:none;padding:0;margin:1rem 0 0}
.tl li{display:grid;grid-template-columns:4.5rem 1fr;gap:.75rem;padding:.55rem 0;border-top:1px solid var(--rule)}
.tl .t{font-family:var(--crt);font-size:1.3rem;color:var(--red);line-height:1.2}
@media (max-width:520px){.top{flex-direction:column}.top .actions{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){.bulb{animation:none}.death.on{animation:none}}
</style>
<script>document.documentElement.setAttribute("data-theme","dark");</script>
</head>

function sha256js(m){

  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const l=m.length, n=((l+9+63)>>6)<<6, p=new Uint8Array(n); p.set(m); p[l]=0x80;
  const dv=new DataView(p.buffer); dv.setUint32(n-4,l*8); dv.setUint32(n-8,Math.floor(l/0x20000000));
  const W=new Uint32Array(64), r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];W[i]=(W[i-16]+(r(a,7)^r(a,18)^(a>>>3))+W[i-7]+(r(b,17)^r(b,19)^(b>>>10)))>>>0;}
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])>>>0;
      const t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;
  }
  const out=new Uint8Array(32), ov=new DataView(out.buffer); for(let i=0;i<8;i++)ov.setUint32(i*4,H[i]); return out;
}

const app = document.getElementById('app');
const enc = new TextEncoder();
async function sha(str){
  const b = enc.encode(str);
  try{ if(window.crypto && crypto.subtle) return new Uint8Array(await crypto.subtle.digest('SHA-256', b)); }catch(_){}
  return sha256js(b);
}
const hex = b => Array.from(b, x => x.toString(16).padStart(2,'0')).join('');
const norm = s => (s||'').toLowerCase().replace(/\s+/g,'');
async function unlock(key){
  key = norm(key); if(!key) return null;
  const blob = VAULT[hex(await sha('lights:' + key))]; if(!blob) return null;
  const data = Uint8Array.from(atob(blob), c => c.charCodeAt(0)), out = new Uint8Array(data.length);
  let i = 0, n = 0;
  while(i < data.length){ const ks = await sha(key + ':' + n++); for(let j=0;j<32&&i<data.length;j++,i++) out[i] = data[i]^ks[j]; }
  return JSON.parse(new TextDecoder().decode(out));
}

function renderPlayer(c, startTab=0){
  window.scrollTo(0,0);
  document.title = c.nick + ' · Lights Out';
  const dead = store.get(c.id+'-dead')==='1';
  app.innerHTML = `
    <header class="top">
      <div><div class="nick">${c.nick}</div><h1>${c.name}</h1></div>
      <div class="actions"><button class="btn ghost small" id="hide" type="button">Hide screen</button><button class="btn ghost small" id="out" type="button">Log out</button></div>
    </header>
    ${dead?`<div class="status dead">👻 You’re a ghost. No talking! Once a round you can answer one yes/no question with your phone flashlight: one flash for yes, two for no.</div>`:''}
    ${c.killer?`<div class="status killer">🔪 You are the killer. Keep this screen hidden.</div>`:''}
    <nav class="tabs" role="tablist">${['Me','My secret','Investigate','Notes'].map((t,i)=>`<button class="tab" role="tab" data-i="${i}" aria-selected="${i===startTab}">${t}</button>`).join('')}</nav>
    <section class="panel" id="panel"></section>`;
  document.getElementById('hide').onclick = () => shade.classList.add('on');
  document.getElementById('out').onclick = () => renderHome();
  const panel = document.getElementById('panel');
  const tabs = app.querySelectorAll('.tab');
  const show = i => { tabs.forEach(t=>t.setAttribute('aria-selected', t.dataset.i==i)); views[i](); };
  tabs.forEach(t => t.onclick = () => show(+t.dataset.i));

  const views = [
    () => panel.innerHTML = `
      <h2>You are ${c.nick}</h2>
      <p>${c.bio}</p>
      <h3>Your quirk</h3><p>${c.quirk} <span class="muted">Do this all night!</span></p>
      <h3>Say this when you introduce yourself</h3><div class="quote">${c.intro}</div>
      <h3>Costume idea</h3><p>${c.costume}</p>
      <h3>The rules, quickly</h3>
      <ul class="knows">
        <li>Keep your secret if you like, but don’t lie about clues you find.${c.killer?' <b>You’re the killer, so you can lie about anything.</b>':''}</li>
        <li>Each round, get the round code from the TV and pick <b>one</b> place to investigate in the Investigate tab.</li>
        <li>Some places are traps. Follow the wrong clue and you won’t come back.</li>
      </ul>`,
    () => panel.innerHTML = `
      <h2>Your secret</h2>
      <div class="card">${c.secret.startsWith('<p')?c.secret:`<p>${c.secret}</p>`}</div>
      <h3>What you know</h3>
      <ul class="knows">${list(c.knows)}</ul>
      <p class="tiny" style="margin-top:1rem">Share these when it helps you, or when someone asks the right question.</p>`,
    renderInvestigate,
    () => {
      panel.innerHTML = `<h2>Notes</h2><p class="muted">Write down what people say. Saved on this phone only.</p>
        <textarea id="notes" aria-label="Notes" placeholder="Who was where at 11:11?"></textarea>
        <p class="tiny" id="saved"></p>
        <p style="margin-top:2rem"><button class="linkbtn" id="reset" type="button">Start over on this phone (for testing)</button></p>`;
      const ta = panel.querySelector('#notes'); ta.value = store.get(c.id+'-notes')||'';
      let t; ta.oninput = () => { clearTimeout(t); t = setTimeout(()=>{ store.set(c.id+'-notes', ta.value); panel.querySelector('#saved').textContent='Saved.'; },400); };
      panel.querySelector('#reset').onclick = () => {
        if(!confirm('Erase your progress and notes on this phone?')) return;
        ['dead','notes','unlocked','r0','r1','r2'].forEach(k=>store.del(c.id+'-'+k));
        renderPlayer(c, 3);
      };
    }
  ];

  function renderInvestigate(){
    const unlocked = +(store.get(c.id+'-unlocked')||0);
    const isDead = store.get(c.id+'-dead')==='1';
    let html = `<h2>Investigate</h2>`;
    if(unlocked < 3 && !isDead){
      html += `<form class="card" id="rform" autocomplete="off" style="margin-bottom:1.5rem">
        <label for="rcode" style="font-weight:700">Round ${unlocked+1} code from the TV</label>
        <div class="row" style="display:flex;gap:.5rem;margin-top:.4rem"><input class="code" id="rcode" autocapitalize="characters" spellcheck="false"><button class="btn" type="submit">Unlock</button></div>
        <div class="err" id="rerr" role="alert"></div></form>`;
    }
    if(unlocked===0 && !isDead) html += `<p class="muted">When the narrator screen shows Round 1, type the code above.</p>`;
    for(let r=unlocked-1; r>=0; r--){
      const pick = store.get(c.id+'-r'+r);
      html += `<div class="roundbox"><h3>Round ${r+1}</h3>`;
      if(pick){
        const L = c.locations.find(l=>l.id===pick), [kind,text] = c.results[r][pick];
        const shown = kind==='trap' && c.killer ? 'This is your own trap. You slip away before anyone sees you.' : text;
        html += `<div class="result ${kind}"><div class="where">${L.icon} ${L.name}</div><p style="margin:0">${shown}</p>${kind==='trap'&&!c.killer?'<p style="margin:.6rem 0 0;font-weight:700;color:var(--red)">You were taken to the Upside Down.</p>':''}</div>`;
      } else if(isDead){
        html += `<p class="muted">Ghosts can’t investigate.</p>`;
      } else {
        html += `<p>Pick <b>one</b> place to search this round. You can’t change your mind.</p>
          <div class="locs">${c.locations.map(l=>`<button class="loc" type="button" data-r="${r}" data-l="${l.id}"><span class="i">${l.icon}</span>${l.name}</button>`).join('')}</div>
          <div class="confirm" id="conf${r}"></div>`;
      }
      html += `</div>`;
    }
    panel.innerHTML = html;
    const f = panel.querySelector('#rform');
    if(f) f.onsubmit = async e => {
      e.preventDefault();
      const w = norm(panel.querySelector('#rcode').value);
      const h = hex(await sha('round:'+w));
      if(h !== PUB.roundHashes[unlocked]){ panel.querySelector('#rerr').textContent = 'That’s not this round’s code. Check the TV.'; return; }
      store.set(c.id+'-unlocked', unlocked+1); renderInvestigate();
    };
    panel.querySelectorAll('.loc').forEach(b => b.onclick = () => {
      const r = +b.dataset.r, L = c.locations.find(l=>l.id===b.dataset.l);
      panel.querySelectorAll('.loc').forEach(x=>x.style.borderColor = x===b ? 'var(--red)' : '');
      const box = panel.querySelector('#conf'+r);
      box.innerHTML = `<span>Go to <b>${L.name}</b>?</span><button class="btn small" type="button" id="go">Yes, go</button>`;
      box.querySelector('#go').onclick = () => {
        store.set(c.id+'-r'+r, L.id);
        const kind = c.results[r][L.id][0];
        if(kind==='trap' && !c.killer){ store.set(c.id+'-dead','1'); die(c, c.results[r][L.id][1]); }
        else renderInvestigate();
      };
    });
  }
  show(startTab);
}

      <li>Then everyone types the <b>round code</b> into their phone and secretly picks <b>one place</b> to investigate.</li>
      <li><b>Some places are traps.</b> Follow the wrong clue and you’ll be dragged into the Upside Down.</li>
      <li>Ghosts can’t talk, but once a round they may answer one yes/no question with a phone flashlight: one flash yes, two flashes no.</li>
      <li>Keep your secrets if you like, but never lie about clues you find. Only the killer may lie.</li>
      <li>After Round 3, everyone votes, including ghosts.</li></ol>`,
    () => `<h2>Meet the gang</h2><p class="muted">Go around the room. Each person reads the introduction line on their phone, then shows off their quirk.</p>
      <div class="suspects">${PUB.cast.map(c=>`<div class="suspect" style="cursor:default"><b>${c.name}</b><span>“${c.nick}”</span></div>`).join('')}</div>`,
    ...R.map((r,k) => () => `<h2>${r.title}</h2>
      <h3 style="font-family:var(--sans);text-transform:uppercase;letter-spacing:.08em;font-size:.95rem;color:var(--red);margin-bottom:.4rem">New clues</h3>
      <ul class="clues">${list(r.clues)}</ul>
      <div class="lead"><div class="lt">The lead: ${r.lead.title}</div><p>${r.lead.text}</p></div>
      <div class="roundcode">
        <div><div class="lbl">Round code</div><div class="w">${PUB.roundWords[k]}</div></div>
        <div><div class="lbl">Discussion timer</div><div class="timer" id="timer">10:00</div>
          <div style="display:flex;gap:.4rem;margin-top:.4rem"><button class="btn small" id="tgo" type="button">Start</button><button class="btn ghost small" id="treset" type="button">Reset</button></div></div>
      </div>
      <div class="steps">
        <div><b>1. Read</b>Read the clues and the lead aloud.</div>
        <div><b>2. Talk</b>Start the timer. Question each other.</div>
        <div><b>3. Investigate</b>Everyone enters the code and picks one place.</div>
        <div><b>4. Reveal</b>Share what you found. Anyone who died, announce it!</div>
      </div>`),
    () => `<h2>The accusation</h2>
      <p>Everyone, ghosts included, points at who they think did it on the count of three. Majority wins. Then tap that person and press Accuse.</p>
      <div class="suspects" id="sus">${PUB.cast.map(c=>`<button class="suspect" type="button" aria-pressed="false" data-id="${c.id}"><b>${c.name}</b><span>“${c.nick}”</span></button>`).join('')}</div>
      <p><button class="btn" id="accuse" type="button" disabled>Accuse</button></p>
      <div id="verdict" aria-live="polite"></div>`,
  ];
  i = Math.max(0, Math.min(slides.length-1, i));
  app.innerHTML = `<div class="slide">${slides[i]()}</div>
    <nav class="navbar">
      <button class="btn ghost small" id="prev" type="button" ${i===0?'disabled':''}>← Back</button>
      <div class="dots">${slides.map((_,k)=>`<button class="dot" type="button" aria-label="Slide ${k+1}" aria-current="${k===i}" data-k="${k}"></button>`).join('')}</div>
      ${i<slides.length-1?`<button class="btn small" id="next" type="button">Next →</button>`:`<button class="btn ghost small" id="home" type="button">Home</button>`}
    </nav>`;
  window.scrollTo(0,0);
  app.querySelector('#prev').onclick = () => renderNarrator(i-1);
  const nx = app.querySelector('#next'); if(nx) nx.onclick = () => renderNarrator(i+1);
  const hm = app.querySelector('#home'); if(hm) hm.onclick = () => renderHome();
  app.querySelectorAll('.dot').forEach(d => d.onclick = () => renderNarrator(+d.dataset.k));

  const tEl = app.querySelector('#timer');
  if(tEl){
    let left = 600, running = false;
    const draw = () => { const m = Math.floor(Math.abs(left)/60), s = Math.abs(left)%60; tEl.textContent = (left<0?'+':'')+m+':'+String(s).padStart(2,'0'); tEl.classList.toggle('over', left<=0); };
    const go = app.querySelector('#tgo');
    go.onclick = () => { running = !running; go.textContent = running?'Pause':'Start';
      clearInterval(timerInt); if(running) timerInt = setInterval(()=>{ left--; draw(); if(left===0) panic(true), setTimeout(()=>panic(false),3000); },1000); };
    app.querySelector('#treset').onclick = () => { clearInterval(timerInt); running=false; go.textContent='Start'; left=600; draw(); };
  }
  const sus = app.querySelector('#sus');
  if(sus){
    let chosen = null;
    sus.querySelectorAll('.suspect').forEach(b => b.onclick = () => {
      chosen = b.dataset.id; sus.querySelectorAll('.suspect').forEach(x=>x.setAttribute('aria-pressed', x===b));
      app.querySelector('#accuse').disabled = false;
    });
    app.querySelector('#accuse').onclick = async () => {
      const v = app.querySelector('#verdict');
      const sol = await unlock('accuse:'+chosen);
      const who = PUB.cast.find(c=>c.id===chosen);
      if(sol){ panic(true); setTimeout(()=>panic(false),2500); v.innerHTML = `<h2 style="color:var(--good);margin-top:1rem">You got them!</h2>` + solHtml(sol); return; }
      v.innerHTML = `<div class="card" style="margin-top:1rem"><h2 style="color:var(--red)">Wrong!</h2>
        <p>${who.name} was innocent. While you were busy accusing ${who.nick}, the real killer slipped away into the night. <b>The killer wins.</b></p>
        <form id="cf" autocomplete="off"><label for="cc" style="font-weight:700">Killer, step forward and enter your secret code to confess.</label>
        <div style="display:flex;gap:.5rem;margin-top:.4rem"><input class="code" id="cc" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Confess</button></div>
        <div class="err" id="cerr" role="alert"></div></form></div>`;
      v.querySelector('#cf').onsubmit = async e => {
        e.preventDefault();
        const s = await unlock('confess:'+norm(v.querySelector('#cc').value));
        if(!s){ v.querySelector('#cerr').textContent = 'That’s not the killer’s code.'; return; }
        v.innerHTML = solHtml(s);
      };
    };
  }
}
function solHtml(s){
  return `<div class="card" style="margin-top:1rem">${s.text}<h3 style="font-family:var(--sans);text-transform:uppercase;letter-spacing:.08em;font-size:.95rem;color:var(--red);margin-top:1rem">What really happened</h3>
    <ul class="tl">${s.timeline.map(([t,x])=>`<li><span class="t">${t}</span><span>${x}</span></li>`).join('')}</ul>
    <p style="margin-top:1rem"><b>Awards:</b> best detective, best liar, best quirk, most dramatic death, and best costume.</p></div>`;
}

/* ---------- game master ---------- */
function renderMaster(m, startTab=0){
  document.body.classList.remove('narr');
  window.scrollTo(0,0);
  document.title = 'Game master · Lights Out';
  const K = m.players.find(p=>p.id===m.killer);
  const kindLabel = {clue:'Clue', nothing:'Nothing', trap:'TRAP'};
  app.innerHTML = `
    <header class="top">
      <div><div class="nick">Game master</div><h1>The whole game</h1></div>
      <div class="actions"><button class="btn small" id="narr" type="button">Narrator screen</button><button class="btn ghost small" id="hide" type="button">Hide screen</button><button class="btn ghost small" id="out" type="button">Log out</button></div>
    </header>
    <div class="status killer">Spoilers! Anyone who reads this page knows the answer, so whoever holds it shouldn’t play.</div>
    <nav class="tabs" role="tablist">${['Solution','Players','Rounds & traps','Locations','Codes'].map((t,i)=>`<button class="tab" role="tab" data-i="${i}" aria-selected="${i===startTab}">${t}</button>`).join('')}</nav>
    <section class="panel" id="panel"></section>`;
  document.getElementById('narr').onclick = () => renderNarrator(0);
  document.getElementById('hide').onclick = () => shade.classList.add('on');
  document.getElementById('out').onclick = () => renderHome();
  const panel = document.getElementById('panel'), tabs = app.querySelectorAll('.tab');
  const resultCell = (r,lid) => { const [k,x] = m.results[r][lid]; return `<div class="result ${k}" style="margin-bottom:.6rem"><div class="where">Round ${r+1}: ${kindLabel[k]}</div><p style="margin:0">${x}</p></div>`; };
  const views = [
    () => `<h2>The killer: ${K.name} “${K.nick}”</h2>${m.solution.text}
      <h3>Full timeline</h3><ul class="tl">${m.solution.timeline.map(([t,x])=>`<li><span class="t">${t}</span><span>${x}</span></li>`).join('')}</ul>
      <h3>Tips for running it</h3><ul class="knows">${list(m.tips)}</ul>`,
    () => `<h2>Every player</h2><p class="muted">Tap a name to see their secret and what they know.</p>
      ${m.players.map(p=>`<details class="card" style="margin-bottom:.6rem;padding:.9rem 1rem"><summary style="cursor:pointer;font-weight:700">${p.name} “${p.nick}”${p.id===m.killer?' <span style="color:var(--red)">· killer</span>':''}${p.optional?' <span class="muted" style="font-weight:400">· optional</span>':''}</summary>
        <div style="margin-top:.75rem"><p class="tiny" style="margin:0 0 .5rem">Code: <span style="font-family:var(--crt);font-size:1.2rem">${p.code}</span></p>
        <p><b>Quirk:</b> ${p.quirk}</p><div class="quote">${p.intro}</div>
        <h3>Secret</h3>${p.secret.startsWith('<p')?p.secret:`<p>${p.secret}</p>`}
        <h3>Knows</h3><ul class="knows">${list(p.knows)}</ul></div></details>`).join('')}`,
    () => `<h2>Rounds and traps</h2>${m.rounds.map((r,i)=>`<div class="card" style="margin-bottom:1rem">
        <h3 style="margin-top:0">${r.title} · code ${m.roundWords[i]}</h3>
        <ul class="knows">${list(r.clues)}</ul>
        <div class="lead"><div class="lt">The lead (fake): ${r.lead.title}</div><p>${r.lead.text}</p></div>
        <p><b>Trap:</b> ${(()=>{const l=m.locations.find(l=>m.results[i][l.id][0]==='trap');return l.icon+' '+l.name;})()}</p>
        <p style="margin:0"><b>How players can spot it:</b> ${m.tells[i]}</p></div>`).join('')}`,
    () => `<h2>What each place gives</h2><p class="muted">The killer is safe from traps; everyone else dies there.</p>
      ${m.locations.map(l=>`<details class="card" style="margin-bottom:.6rem;padding:.9rem 1rem"><summary style="cursor:pointer;font-weight:700">${l.icon} ${l.name}</summary><div style="margin-top:.75rem">${[0,1,2].map(r=>resultCell(r,l.id)).join('')}</div></details>`).join('')}`,
    () => `<h2>Codes</h2><p>Send each player only their own code.</p>
      <ul class="tl">${m.players.map(p=>`<li style="grid-template-columns:1fr auto"><span>${p.name} “${p.nick}”${p.optional?' <span class="muted">(optional)</span>':''}</span><span class="t">${p.code}</span></li>`).join('')}</ul>
      <h3>Round codes</h3><ul class="tl">${m.roundWords.map((w,i)=>`<li style="grid-template-columns:1fr auto"><span>Round ${i+1}</span><span class="t">${w}</span></li>`).join('')}</ul>
      <p class="tiny" style="margin-top:1rem">To check what a player sees, log out and enter their code. Use “Start over on this phone” in their Notes tab to reset anything you tried.</p>`,
  ];
  const show = i => { tabs.forEach(t=>t.setAttribute('aria-selected', t.dataset.i==i)); panel.innerHTML = views[i](); };
  tabs.forEach(t => t.onclick = () => show(+t.dataset.i));
  show(startTab);
}

/* ---------- boot ---------- */
(async()=>{
  const h = location.hash.slice(1);
  if(h === 'narrator') return renderNarrator(0);
  if(h){ try{ const d = await unlock(h); if(d && d.kind==='char') return renderPlayer(d); if(d && d.kind==='master') return renderMaster(d); }catch(_){} }
  renderHome();
})();
</script>
</body>
</html>
